# MXQ S805 TV box (TRONFY and the many boards sold under the same name)
# Amlogic S805 (meson8b), 4x Cortex-A5 @1.5GHz, 1GB DDR3,
# 8GB raw NAND (SDTNRGAMA-008G on the unit this was written against),
# 100Mbit ethernet, USB 2.0, SD card slot.
#
# Added to this fork of dann2333/ws1508-armbian to run its meson8b
# raw-NAND work on a second, different S805 board. The kernel patches are
# the upstream ones untouched; what is new here is the board config, the
# boot script and the device tree in
# userpatches/kernel/archive/meson-6.12/dt/meson8b-mxq-nand.dts.
BOARD_NAME="MXQ S805"
BOARD_VENDOR="generic"
BOARDFAMILY="meson8b"
BOARD_MAINTAINER=""
INTRODUCED="2014"
KERNEL_TARGET="current"
KERNEL_TEST_TARGET="current"

# The bootloader stays the vendor one already in the box. Nothing here
# writes to internal storage.
BOOTCONFIG="none"
BOOTSCRIPT="boot-mxq-s805.cmd:boot.cmd"
BOOTENV_FILE="mxq-s805.txt"

# Ship the NAND-enabled device tree and the meson8b raw-NAND driver. The
# driver binds only where a dtb enables an amlogic,meson8b-nfc node.
enable_extension "ws1508-nand"

# Leave the first 16 MiB alone: the vendor bootloader and the Amlogic
# reserved area live there on these boxes.
OFFSET="16"
BOOTSIZE="256"
BOOTFS_TYPE="fat"

BOOT_LOGO=desktop

family_tweaks() {
	cp "$SRC/packages/blobs/splash/armbian-u-boot-24.bmp" "$SDCARD/boot/boot.bmp"
}
